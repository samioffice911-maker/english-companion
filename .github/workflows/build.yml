name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the app
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk EnglishCompanion.apk

      - name: Keep APK for the phone test
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: EnglishCompanion.apk

      - name: Publish to Releases (download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: English Companion v0.3.${{ github.run_number }}
          body: |
            Download **EnglishCompanion.apk** below and open it on your Android phone.
            Built from commit ${{ github.sha }}.
          files: EnglishCompanion.apk
          make_latest: true

  # Opens the app on a virtual Android phone, takes screenshots of every screen and checks for crashes.
  phone-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Prepare
        run: cp EnglishCompanion.apk app.apk

      - name: Enable KVM (makes the virtual phone fast)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/ui-test.sh

      - name: Save screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-results
          path: shots/

      - name: Fail if the app crashed
        run: test ! -f shots/CRASHED
