name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the app
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk EnglishCompanion.apk

      - name: Publish to Releases (download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: English Companion v0.2.${{ github.run_number }}
          body: |
            Download **EnglishCompanion.apk** below and open it on your Android phone.
            Built from commit ${{ github.sha }}.
          files: EnglishCompanion.apk
          make_latest: true
